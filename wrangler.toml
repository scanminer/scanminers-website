name = "scanminers-website"
main = ".open-next/worker.js"
compatibility_date = "2025-09-23"
compatibility_flags = ["nodejs_compat"]

# OpenNext Cloudflare adapter configuration
# The adapter builds a Worker for dynamic routes/API and a separate asset Worker
# This is the recommended deployment method for full-stack Next.js on Cloudflare

# Asset Worker service binding
# The main worker delegates static asset requests to this service
[[services]]
binding = "ASSETS"
service = "scanminers-website-assets"
