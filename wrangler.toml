name = "scanminers-website"
main = ".open-next/worker.js"
compatibility_date = "2025-09-23"
compatibility_flags = ["nodejs_compat"]

# Custom domain routes
routes = [
  { pattern = "scanminers.com/*", zone_name = "scanminers.com" },
  { pattern = "www.scanminers.com/*", zone_name = "scanminers.com" }
]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
NEXTAUTH_URL = "https://scanminers.com"
NEXT_PUBLIC_SITE_URL = "https://scanminers.com"
ADMIN_ALLOWED_EMAIL_DOMAINS = "scanminers.com"
ADMIN_ALLOWED_EMAILS = "admin@scanminers.com,mehrtash@scanminers.com,amin@scanminers.com"
ADMIN_ALLOWED_GITHUB_LOGINS = "scanminers-founder"
ADMIN_USER = "admin"
ADMIN_ACTOR_NAME = "Mahmood Asadi"
ENABLE_ADMIN_PASSWORD_LOGIN = "true"
ALLOW_ADMIN_WITHOUT_AUTH = "false"
GH_REPO = "scanminer/scanminers-website"
GIT_DEFAULT_BRANCH = "main"
CONTENT_AUTHOR_NAME = "ScanminersBot"
CONTENT_AUTHOR_EMAIL = "bot@scanminers.com"
SENTRY_ENVIRONMENT = "production"
RESEND_FROM = "contact@scanminers.com"
RESEND_TO = "founders@scanminers.com"
OPENAI_MODEL = "gpt-4o"
PERPLEXITY_MODEL = "sonar-pro"
ENABLE_INITIATE_API = "true"
WEEKLY_TOKENS = "6000"
MONTHLY_TOKENS = "20000"

[[d1_databases]]
binding = "LEADS_DB"
database_name = "scanminers-leads-v2"
database_id = "d919665a-c650-4f1c-817f-bc6a3f729c54"
migrations_dir = "database/migrations"

# ============================================================================
# Service Binding to Scanminers Brain Worker (P1: internal API calls)
# Source: ADR-0012 — Equira as Control Plane, Brain as Science Plane
# ============================================================================
[[services]]
binding = "BRAIN"
service = "scanminers-brain"
# Note: Requires scanminers-brain Worker to be deployed first
# Deploy order: 1) Brain Worker  2) Website Worker
