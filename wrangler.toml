name = "scanminers"
main = ".open-next/worker.js"
compatibility_date = "2025-09-23"
compatibility_flags = ["nodejs_compat"]

# OpenNext Cloudflare adapter configuration
# The adapter builds a Worker for dynamic routes/API and serves static assets
# This is the recommended deployment method for full-stack Next.js on Cloudflare

# Assets configuration
# OpenNext generates static assets in .open-next/assets
# run_worker_first=false (default) keeps asset hits off billed Worker - recommended
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Observability configuration
# Enable logs and traces for debugging and monitoring
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

# D1 Database for Leads
# To set up: run `bash scripts/setup-d1.sh`
# Local dev: automatically creates .wrangler/state/v3/d1 directory
# Production: create with `wrangler d1 create scanminers-leads` and update database_id below
[[d1_databases]]
binding = "LEADS_DB"
database_name = "scanminers-leads"
database_id = "ab5a9ca1-0c10-4ed4-8d04-8df2a910b9da"  # Update with your actual D1 database ID
migrations_dir = "database/migrations"
