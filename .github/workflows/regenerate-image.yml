name: Regenerate Post Image

on:
  workflow_dispatch:
    inputs:
      post_slug:
        description: 'Slug of the post (content/insights/<slug>.mdx)'
        required: true
        type: string
      prompt:
        description: 'Optional prompt override to use for generation'
        required: false
        type: string
      branch:
        description: 'Target branch to operate on (dispatch ref)'
        required: false
        type: string
      post_path:
        description: 'Optional explicit MDX path (e.g. content/case-studies/foo.mdx)'
        required: false
        type: string

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Checkout the branch whose workflow was dispatched (or the provided input),
          # so we use the matching script version without requiring default-branch merge.
          # Falls back to the dispatch ref name.
          ref: ${{ inputs.branch || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps
        run: npm ci
      - name: Debug inputs
        run: |
          echo "ref_name=${{ github.ref_name }}"
          echo "inputs.branch=${{ inputs.branch }}"
          echo "inputs.post_slug=${{ inputs.post_slug }}"
          echo "using BASE_BRANCH=${{ inputs.branch || github.ref_name }}"
      - name: Regenerate image
        env:
          GH_TOKEN: ${{ secrets.CONTENT_BOT_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          STABILITY_API_KEY: ${{ secrets.STABILITY_API_KEY }}
          POST_SLUG: ${{ inputs.post_slug }}
          POST_PATH: ${{ inputs.post_path }}
          # Operate on the same branch we checked out unless explicitly provided
          BASE_BRANCH: ${{ inputs.branch || github.ref_name }}
          PROMPT_OVERRIDE: ${{ inputs.prompt }}
        run: node scripts/regenerate-image-for-post.js
