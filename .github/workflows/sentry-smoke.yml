name: Sentry Smoke Test

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to test (e.g., https://preview.example.com)"
        required: true
        type: string

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check health endpoint
        shell: bash
        run: |
          set -euo pipefail
          url="${{ inputs.base_url }}/api/health"
          echo "Requesting: $url"
          status=$(curl -s -o /dev/null -w "%{http_code}" "$url" || true)
          echo "Status: $status"
          if [ "$status" -ne 200 ]; then
            echo "Expected 200 from health endpoint, got $status" >&2
            exit 1
          fi
      - name: Hit frontend example page (triggers client error)
        shell: bash
        run: |
          set -euo pipefail
          curl -s "${{ inputs.base_url }}/sentry-example-page" >/dev/null || true
        
      - name: Notes
        run: echo "Verify the frontend event in Sentry project after running this smoke test."
