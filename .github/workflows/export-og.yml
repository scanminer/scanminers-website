name: Export OG Covers

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]
    paths:
      - "content/insights/**/index.mdx"
      - "content/case-studies/**/index.mdx"

concurrency:
  group: export-og-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  export-og:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Build
        run: npm run build
      - name: Start server
        run: |
          nohup npx next start -p 3000 &
          for i in {1..30}; do
            if curl -sSf http://localhost:3000/ > /dev/null; then echo "Next is up"; break; fi
            sleep 1
          done
      - name: Export OG covers
        env:
          SITE_URL: http://localhost:3000
        run: npm run og:fetch
      - name: Create PR if changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet; then
            echo "No OG changes to commit."; exit 0;
          fi
          if [ -n "$(git status --porcelain)" ]; then
            branch="ci/og-exports-$(date +%s)"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout -b "$branch"
            git add public/images/og || true
            git commit -m "build(og): export OG cover images"
            git push origin "$branch"
            pr_title="Export OG cover images"
            pr_body="Automated export of branded OG images via /og route."
            curl -s -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls" \
              -d "$(jq -n --arg t "$pr_title" --arg h "$branch" --arg b "main" --arg body "$pr_body" '{title:$t, head:$h, base:$b, body:$body}')"
          else
            echo "No OG changes to commit."
          fi
