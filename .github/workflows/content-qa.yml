name: 'Content Quality Gate'

on:
  pull_request:
    paths:
      - 'content/**'
      - 'contentlayer.config.ts'

jobs:
  qa:
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci

      - name: Contentlayer Validation
        run: npx contentlayer build

      - name: Semantic QA
        run: node scripts/semantic-qa.js

      - name: Check Alt Text & Image Sizes (≤1MB)
        run: node scripts/check-alt-and-size.js

      - name: Link Checker
        uses: lycheeverse/lychee-action@v1
        with:
          args: --no-progress --accept 200,206 ./content

      - name: Build site (for Lighthouse)
        run: npm run build

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          configPath: .lighthouserc.json
          uploadArtifacts: true
