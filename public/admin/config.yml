# public/admin/config.yml

backend:
  name: github
  repo: scanminer/scanminers-website
  branch: main
  auth_type: implicit
  app_id: Ov23lilN5z6EF70BnOw2
  base_url: https://scanminers.com
  auth_endpoint: api/decap-auth/auth

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

publish_mode: editorial_workflow

collections:
  # This is the new collection for creating AI content briefs
  - name: "briefs"
    label: "AI Content Briefs"
    folder: "content/briefs"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Topic / Article Title", name: "title", widget: "string" }
      - { label: "Context for AI", name: "context", widget: "markdown", hint: "Provide detailed notes, key points, data, or links for the AI to use." }
      - {
          label: "Status",
          name: "status",
          widget: "select",
          options: ["New Brief", "Generating Draft", "Draft Ready"],
          default: "New Brief",
          hint: "Set to 'New Brief' to kick off automation. The system will update it.",
        }

  # This is for editing existing Insights
  - name: "insights"
    label: "Insights"
    folder: "content/insights"
    extension: "mdx"
    format: "frontmatter"
    create: true # Allows manual creation as a fallback
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "publishedAt", widget: "datetime" }
      - { label: "Summary", name: "summary", widget: "text" }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Cover Image", name: "image", widget: "image", required: false }
      - { label: "Image Alt Text", name: "imageAlt", widget: "string", required: false }
      - { label: "Image Prompt", name: "imagePrompt", widget: "text", required: false, hint: "Saved prompt used to generate the cover." }
      - { label: "Regenerate Cover (AI)", name: "regenerateCover", widget: "regenerateCover", required: false, hint: "Dispatches the GitHub Action to regenerate the cover image. Uses Image Prompt unless you provide an override." }
      - {
          label: "Review Status",
          name: "review_status",
          widget: "select",
          options: ["needs-review", "approved"],
          default: "needs-review",
        }
      - { label: "Body", name: "body", widget: "markdown" }

  # This is for editing existing Case Studies
  - name: "case_studies"
    label: "Case Studies"
    folder: "content/case-studies"
    extension: "mdx"
    format: "frontmatter"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "publishedAt", widget: "datetime" }
      - { label: "Summary", name: "summary", widget: "text" }
      - { label: "Provenance", name: "provenance", widget: "list", required: false }
      - { label: "Cover Image", name: "image", widget: "image", required: false }
      - { label: "Image Alt Text", name: "imageAlt", widget: "string", required: false }
      - { label: "Body", name: "body", widget: "markdown" }
