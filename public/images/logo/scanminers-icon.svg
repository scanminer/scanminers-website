<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iconBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="smStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="softGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect
    x="4"
    y="4"
    width="56"
    height="56"
    rx="14"
    fill="url(#iconBg)"
    stroke="#38bdf8"
    stroke-opacity="0.35"
    stroke-width="1.5"
  />

  <!-- Text lockup -->
  <g font-family="'Space Grotesk', 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="600" text-anchor="middle" fill="#e2e8f0">
    <text x="32" y="29" font-size="15" letter-spacing="0.08em">Scan</text>
    <text x="32" y="45" font-size="16" letter-spacing="0.12em">Miners</text>
  </g>

  <!-- Highlight underline -->
  <line x1="16" y1="50" x2="48" y2="50" stroke="url(#smStroke)" stroke-width="1.8" stroke-linecap="round" />
</svg>
