<svg width="1600" height="900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#B8860B;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glow-gold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#B8860B;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#D4AF37;stop-opacity:0" />
    </radialGradient>
    <pattern id="grain-gold" patternUnits="userSpaceOnUse" width="100" height="100">
      <rect width="100" height="100" fill="url(#grad-gold)"/>
      <circle cx="10" cy="10" r="1.5" fill="#B8860B" opacity="0.3"/>
      <circle cx="45" cy="25" r="1" fill="#FFD700" opacity="0.2"/>
      <circle cx="75" cy="50" r="1.2" fill="#D4AF37" opacity="0.25"/>
      <circle cx="30" cy="70" r="0.8" fill="#B8860B" opacity="0.2"/>
      <circle cx="90" cy="85" r="1.3" fill="#FFD700" opacity="0.3"/>
    </pattern>
  </defs>
  
  <!-- Base gradient -->
  <rect width="1600" height="900" fill="url(#grad-gold)"/>
  
  <!-- Glow overlay -->
  <rect width="1600" height="900" fill="url(#glow-gold)"/>
  
  <!-- Grain texture -->
  <rect width="1600" height="900" fill="url(#grain-gold)" opacity="0.4"/>
  
  <!-- Subtle vignette -->
  <rect width="1600" height="900" fill="radial-gradient(ellipse at center, transparent 0%, rgba(0,0,0,0.3) 100%)" opacity="0.5"/>
</svg>