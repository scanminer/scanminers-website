<svg width="1600" height="900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-titanium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#878681;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#696969;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#C0C0C0;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glow-titanium" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#696969;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#878681;stop-opacity:0" />
    </radialGradient>
    <pattern id="grain-titanium" patternUnits="userSpaceOnUse" width="100" height="100">
      <rect width="100" height="100" fill="url(#grad-titanium)"/>
      <circle cx="10" cy="10" r="1.5" fill="#696969" opacity="0.3"/>
      <circle cx="45" cy="25" r="1" fill="#C0C0C0" opacity="0.2"/>
      <circle cx="75" cy="50" r="1.2" fill="#878681" opacity="0.25"/>
      <circle cx="30" cy="70" r="0.8" fill="#696969" opacity="0.2"/>
      <circle cx="90" cy="85" r="1.3" fill="#C0C0C0" opacity="0.3"/>
    </pattern>
  </defs>
  
  <!-- Base gradient -->
  <rect width="1600" height="900" fill="url(#grad-titanium)"/>
  
  <!-- Glow overlay -->
  <rect width="1600" height="900" fill="url(#glow-titanium)"/>
  
  <!-- Grain texture -->
  <rect width="1600" height="900" fill="url(#grain-titanium)" opacity="0.4"/>
  
  <!-- Subtle vignette -->
  <rect width="1600" height="900" fill="radial-gradient(ellipse at center, transparent 0%, rgba(0,0,0,0.3) 100%)" opacity="0.5"/>
</svg>