<svg width="1600" height="900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-zirconium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8D4B0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#D2B48C;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#F5DEB3;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glow-zirconium" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#D2B48C;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#E8D4B0;stop-opacity:0" />
    </radialGradient>
    <pattern id="grain-zirconium" patternUnits="userSpaceOnUse" width="100" height="100">
      <rect width="100" height="100" fill="url(#grad-zirconium)"/>
      <circle cx="10" cy="10" r="1.5" fill="#D2B48C" opacity="0.3"/>
      <circle cx="45" cy="25" r="1" fill="#F5DEB3" opacity="0.2"/>
      <circle cx="75" cy="50" r="1.2" fill="#E8D4B0" opacity="0.25"/>
      <circle cx="30" cy="70" r="0.8" fill="#D2B48C" opacity="0.2"/>
      <circle cx="90" cy="85" r="1.3" fill="#F5DEB3" opacity="0.3"/>
    </pattern>
  </defs>
  
  <!-- Base gradient -->
  <rect width="1600" height="900" fill="url(#grad-zirconium)"/>
  
  <!-- Glow overlay -->
  <rect width="1600" height="900" fill="url(#glow-zirconium)"/>
  
  <!-- Grain texture -->
  <rect width="1600" height="900" fill="url(#grain-zirconium)" opacity="0.4"/>
  
  <!-- Subtle vignette -->
  <rect width="1600" height="900" fill="radial-gradient(ellipse at center, transparent 0%, rgba(0,0,0,0.3) 100%)" opacity="0.5"/>
</svg>