# workers/content-cron/wrangler.toml
name = "scanminers-content-cron"
main = "src/index.ts"
compatibility_date = "2025-10-11"

# Cron triggers are now ENABLED.
[triggers]
crons = ["0 9 * * 1"] # Runs every Monday at 9 AM UTC.

[vars]
GH_REPO = "scanminer/scanminers-website"
# Optional: override Perplexity model at deploy-time. Default used in code is "sonar-pro".
# PERPLEXITY_MODEL = "sonar-pro"
