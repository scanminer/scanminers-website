# Scanminers Brain Worker
# Separate service for geological evidence management
# Per DOCTRINE 001: Binary Separation - API-only integration with website Worker

name = "scanminers-brain"
main = "src/index.ts"
compatibility_date = "2025-09-23"
compatibility_flags = ["nodejs_compat"]

# Environment variables (non-secret)
[vars]
BRAIN_REGION = "Turkey"
BRAIN_VERSION = "0.1.0"

# D1 Database for Brain data (separate from LEADS_DB)
# Created: 2026-01-02 via `wrangler d1 create scanminers-brain`
[[d1_databases]]
binding = "BRAIN_DB"
database_name = "scanminers-brain"
database_id = "c6a0a33f-4f08-4a01-b10a-15ebf01cd139"
migrations_dir = "database/migrations"

# R2 Bucket for document/evidence storage
# Created: 2026-01-02 via `wrangler r2 bucket create scanminers-evidence`
[[r2_buckets]]
binding = "BRAIN_DOCS"
bucket_name = "scanminers-evidence"

# Service binding back to main website (for auth validation if needed)
# [[services]]
# binding = "WEBSITE"
# service = "scanminers-website"

# Production environment overrides
[env.production]
# BRAIN_REVIEWER_EMAIL set via: npx wrangler secret put BRAIN_REVIEWER_EMAIL --env production
# Value: amin80@gmail.com (2026-01-02)

[env.production.vars]
BRAIN_REGION = "Turkey"
BRAIN_VERSION = "0.1.0"

# Production D1 Database (same DB, explicit binding required per CF env rules)
[[env.production.d1_databases]]
binding = "BRAIN_DB"
database_name = "scanminers-brain"
database_id = "c6a0a33f-4f08-4a01-b10a-15ebf01cd139"
migrations_dir = "database/migrations"

# Production R2 Bucket (same bucket, explicit binding required per CF env rules)
[[env.production.r2_buckets]]
binding = "BRAIN_DOCS"
bucket_name = "scanminers-evidence"
